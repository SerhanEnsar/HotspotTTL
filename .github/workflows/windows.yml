name: Windows

on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derle
        run: dotnet build windows/HotspotTTL.csproj -c Release

      - name: Uçtan uca test (netsh + paket yakalama)
        shell: pwsh
        run: |
          $exe = "windows/bin/Release/net48/HotspotTTL.exe"
          pip install --quiet scapy

          function Capture($name) {
            pktmon filter remove | Out-Null
            pktmon filter add -t TCP -p 443 | Out-Null
            pktmon start --capture --pkt-size 128 --file-name "$name.etl" | Out-Null
            curl.exe -4 -sS -o NUL -m 10 https://www.google.com/
            curl.exe -4 -sS -o NUL -m 10 https://github.com/
            pktmon stop | Out-Null
            pktmon etl2pcap "$name.etl" --out "$name.pcapng" | Out-Null
            python -c "from scapy.all import *; import collections; p=rdpcap('$name.pcapng'); print(len(p), p[0].summary() if p else ''); c=collections.Counter(x[IP].ttl for x in p if IP in x and TCP in x and x[TCP].dport==443); print('$name giden TTL:', dict(c))" | Tee-Object -Variable res
            return "$res"
          }

          Write-Host "--- durum (önce)"; & $exe --status | Out-String | Write-Host
          $before = Capture "before"

          Write-Host "--- aç"; & $exe --on | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "--on başarısız" }
          $s = New-Object Net.Sockets.Socket InterNetwork, Stream, Tcp; Write-Host "Yeni soket TTL: $($s.Ttl)"
          $on = Capture "on"

          Write-Host "--- kapat"; & $exe --off | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "--off başarısız" }
          $after = Capture "after"

          if ("$on" -notmatch 'on giden TTL: \{65: \d+\}') { throw "Açıkken giden TTL 65 değil: $on" }
          $st = & $exe --status | Out-String
          if ($st -notmatch 'I \d+ IPv4 0 ') { throw "Arayüz hop limit'i 0'a (global) dönmedi" }
          if ("$after" -match '\b65:') { throw "Kapattıktan sonra TTL geri dönmedi: $after" }
          Write-Host "OK"

      - uses: actions/upload-artifact@v4
        with:
          name: HotspotTTL-Windows
          path: windows/bin/Release/net48/HotspotTTL.exe
